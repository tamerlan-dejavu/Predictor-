# Render Blueprint: Web API (Docker). After deploy, set APP_CORS_ALLOWED_ORIGINS to your Vercel URL.
services:
  - type: web
    name: branch-predictor-lab-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

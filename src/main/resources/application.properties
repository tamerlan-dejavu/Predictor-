# Render и другие PaaS задают PORT; локально по умолчанию 8080
server.port=${PORT:8080}
spring.application.name=branch-predictor-lab

# CORS: через запятую. После деплоя фронта на Vercel добавьте, например:
# https://your-app.vercel.app
# Можно переопределить env на Render: APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
